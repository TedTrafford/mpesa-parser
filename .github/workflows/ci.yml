name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.5.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          # Hard fail on syntax errors, undefined names, and unused imports
          flake8 config.py parser/ db/ parse_single.py process_all_pdfs.py \
            --count \
            --select=E9,F63,F7,F82,F4 \
            --show-source \
            --statistics
          # Style pass — ignore alignment/whitespace conventions used in the codebase
          flake8 config.py parser/ db/ parse_single.py process_all_pdfs.py \
            --count \
            --max-line-length=120 \
            --extend-ignore=E203,E221,E272,E302,E303,E305,E402,E501,W291,W292,W293,W503 \
            --statistics

      - name: Run tests with coverage
        env:
          # Prevent any real DB connections during tests
          MPESA_DB_HOST: "localhost"
          MPESA_DB_PORT: "3306"
          MPESA_DB_NAME: "test_db"
          MPESA_DB_USER: "test_user"
          MPESA_DB_PASSWORD: "test_pass"
        run: |
          pytest tests/ \
            --cov=config \
            --cov=parser \
            --cov=parse_single \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
