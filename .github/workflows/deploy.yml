name: Deploy to Production

# Triggers whenever a push lands on main (i.e. a PR is merged).
# Enforce that CI passes first via branch-protection rules requiring the
# "CI / Lint & Test" status checks before a PR can be merged.
on:
  push:
    branches:
      - main
  workflow_dispatch:   # allows manual trigger from the Actions tab

jobs:
  deploy:
    name: SSH Deploy to 139.84.243.180
    runs-on: ubuntu-latest

    steps:
      - name: Verify required secrets are set
        run: |
          missing=()
          [[ -z "$SSH_HOST"        ]] && missing+=(SSH_HOST)
          [[ -z "$SSH_USER"        ]] && missing+=(SSH_USER)
          [[ -z "$SSH_PRIVATE_KEY" ]] && missing+=(SSH_PRIVATE_KEY)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: the following repository secrets are not set: ${missing[*]}"
            echo "Add them at: Settings → Secrets and variables → Actions → Repository secrets"
            exit 1
          fi
        env:
          SSH_HOST:        ${{ secrets.SSH_HOST }}
          SSH_USER:        ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: bash /var/www/server/parser/scripts/server-deploy.sh
