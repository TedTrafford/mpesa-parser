name: Deploy to Production

# Triggers whenever a commit lands on main — i.e. when a branch is merged
# into main via a pull request (or a direct push to main).
#
# Recommended: protect the `main` branch and require the "CI / Lint & Test"
# status checks to pass before a PR can be merged, so only tested code is
# ever deployed.
on:
  push:
    branches:
      - main
  workflow_dispatch:   # allows manual trigger from the Actions tab

# Make sure two deploys never run at the same time. A newer push cancels an
# in-flight deploy of older code.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROD_HOST: "65.20.86.247"   # production server

jobs:
  deploy:
    name: SSH Deploy to 65.20.86.247
    runs-on: ubuntu-latest

    steps:
      - name: Verify required secrets are set
        run: |
          missing=()
          [[ -z "$SSH_USER"        ]] && missing+=(SSH_USER)
          [[ -z "$SSH_PRIVATE_KEY" ]] && missing+=(SSH_PRIVATE_KEY)
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "ERROR: the following repository secrets are not set: ${missing[*]}"
            echo "Add them at: Settings → Secrets and variables → Actions → Repository secrets"
            exit 1
          fi

          if [[ "$SSH_PRIVATE_KEY" == *"BEGIN PUBLIC KEY"* ]]; then
            echo "ERROR: SSH_PRIVATE_KEY looks like a PUBLIC key."
            echo "Store the private key (BEGIN OPENSSH PRIVATE KEY or BEGIN RSA PRIVATE KEY)."
            exit 1
          fi
          if [[ "$SSH_PRIVATE_KEY" != *"BEGIN"* ]]; then
            echo "ERROR: SSH_PRIVATE_KEY is missing PEM headers."
            echo "Paste the entire key file, including BEGIN/END lines and newlines."
            exit 1
          fi

          printf '%s\n' "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          if ! ssh-keygen -y -f /tmp/deploy_key >/dev/null 2>&1; then
            echo "ERROR: SSH_PRIVATE_KEY is invalid or passphrase-protected."
            echo "Generate a key without a passphrase:"
            echo "  bash scripts/setup-github-deploy-key.sh <ssh_user>"
            exit 1
          fi
          rm -f /tmp/deploy_key

          echo "Secrets OK. Deploying as ${SSH_USER}@${{ env.PROD_HOST }}:${SSH_PORT:-22}"
        env:
          SSH_USER:        ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT:        ${{ secrets.SSH_PORT }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.PROD_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script: bash /var/www/server/parser/scripts/server-deploy.sh
